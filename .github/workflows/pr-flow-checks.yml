name: PR flow checks

on:
  pull_request:
    paths:
      - '.github/workflows/pr-flow-signal.yml'
      - '.github/workflows/pr-flow.yml'
      - '.github/workflows/pr-flow-checks.yml'
      - '.github/scripts/pr_flow/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/pr-flow-signal.yml'
      - '.github/workflows/pr-flow.yml'
      - '.github/workflows/pr-flow-checks.yml'
      - '.github/scripts/pr_flow/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the scripts under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts/pr_flow
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run PR flow unit tests
        run: python -m unittest discover -s .github/scripts/pr_flow -p 'test_*.py'
