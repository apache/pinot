name: "[Pinot Release] Patch OpenJDK in Legacy Docker Images"

on:
  workflow_dispatch:

concurrency:
  group: legacy-openjdk-image-patch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.inventory.outputs.builds }}
      groups: ${{ steps.inventory.outputs.groups }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read image inventory
        id: inventory
        run: |
          set -euo pipefail
          inventory=.github/workflows/scripts/docker/legacy-jdk-images.json
          builds=$(jq -ce '.builds | select(type == "array" and length > 0) | {include: .}' "$inventory")
          groups=$(jq -ce '.groups | select(type == "array" and length > 0) | {include: .}' "$inventory")
          printf 'builds=%s\ngroups=%s\n' "$builds" "$groups" >> "$GITHUB_OUTPUT"

  patch:
    name: Patch ${{ matrix.release }} Java ${{ matrix.major }} ${{ matrix.vendor }} ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Patch, test and publish platform image
        env:
          RELEASE: ${{ matrix.release }}
          VENDOR: ${{ matrix.vendor }}
          MAJOR: ${{ matrix.major }}
          ARCH: ${{ matrix.arch }}
          OLD_DIGEST: ${{ matrix.old_digest }}
          PRIMARY_TAG: ${{ matrix.primary_tag }}
          PLATFORM_ALIASES: ${{ matrix.platform_aliases }}
          MINIMUM_VERSION: ${{ matrix.minimum_version }}
          CORRETTO_PACKAGE_VERSION: ${{ matrix.corretto_package_version }}
          MS_DONOR: ${{ matrix.ms_donor }}
          RESULTS_DIR: ${{ runner.temp }}/legacy-jdk-results
        run: bash .github/workflows/scripts/docker/legacy-jdk-image-patch.sh patch
      - name: Save the verified platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-jdk-${{ matrix.primary_tag }}
          path: ${{ runner.temp }}/legacy-jdk-results/${{ matrix.primary_tag }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish ${{ matrix.release }} Java ${{ matrix.major }} ${{ matrix.vendor }} manifests
    needs: [plan, patch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read verified platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: legacy-jdk-${{ matrix.release }}-${{ matrix.major }}-${{ matrix.vendor }}-linux-*
          path: ${{ runner.temp }}/legacy-jdk-results
          merge-multiple: true
      - name: Publish verified platform digests
        env:
          RELEASE: ${{ matrix.release }}
          VENDOR: ${{ matrix.vendor }}
          MAJOR: ${{ matrix.major }}
          AMD64_TAG: ${{ matrix.amd64_tag }}
          ARM64_TAG: ${{ matrix.arm64_tag }}
          AMD64_OLD_DIGEST: ${{ matrix.amd64_old_digest }}
          ARM64_OLD_DIGEST: ${{ matrix.arm64_old_digest }}
          OLD_INDEX_DIGEST: ${{ matrix.old_index_digest }}
          INDEX_ALIASES: ${{ matrix.index_aliases }}
          RESULTS_DIR: ${{ runner.temp }}/legacy-jdk-results
        run: bash .github/workflows/scripts/docker/legacy-jdk-image-patch.sh publish
