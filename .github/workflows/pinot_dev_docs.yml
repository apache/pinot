# Builds the developer documentation under docs/dev with `zensical build --strict`. The build fails on broken links,
# broken anchors, and other Zensical warnings. This workflow does not publish the site.
name: Pinot Dev Docs

on:
  push:
    branches:
      - master
    paths:
      - 'zensical.toml'
      - 'docs/dev/**'
      - '.github/workflows/pinot_dev_docs.yml'
  pull_request:
    paths:
      - 'zensical.toml'
      - 'docs/dev/**'
      - '.github/workflows/pinot_dev_docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Zensical
        run: pip install zensical==0.1.1
      - name: Build developer documentation
        run: zensical build --strict
