name: PR flow

on:
  workflow_run:
    workflows: [PR flow signal]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number; leave empty to process the bounded backlog'
        required: false
        type: string
      force:
        description: 'Regenerate even when the current revision already has a flow'
        required: false
        type: boolean
        default: false
      preview:
        description: 'Generate an artifact without changing the PR description'
        required: false
        type: boolean
        default: false
      max_prs:
        description: 'Maximum PRs to select from the backlog'
        required: false
        type: string
        default: '3'

permissions: {}

env:
  PR_FLOW_MODEL: ${{ vars.PR_FLOW_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}

jobs:
  plan:
    if: >-
      github.repository == 'apache/pinot' && vars.PR_FLOW_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_prs: ${{ steps.plan.outputs.has_prs }}
    steps:
      - name: Check out only the trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/pr_flow
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select eligible PRs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Used here only to verify bot-owned block signatures; planning makes no model calls.
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          MAX_PRS: ${{ inputs.max_prs || '3' }}
        run: python .github/scripts/pr_flow/main.py plan

  diagram:
    needs: plan
    if: needs.plan.outputs.has_prs == 'true' && vars.PR_FLOW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: pr-flow-${{ github.repository }}-${{ matrix.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Check out only the trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/pr_flow
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate the current PR flow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          PR_NUMBER: ${{ matrix.pr_number }}
          EXPECTED_HEAD_SHA: ${{ matrix.expected_head_sha || '' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
          PR_FLOW_OUTPUT_DIR: ${{ runner.temp }}/pr-flow
        run: python .github/scripts/pr_flow/main.py run
      - name: Retain the generated preview and run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-flow-${{ matrix.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-flow
          if-no-files-found: ignore
          retention-days: 7
