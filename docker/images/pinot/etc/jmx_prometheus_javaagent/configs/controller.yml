rules:
# Dropwizard exposes Number as an alias of Value for numeric gauges.
- pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=.*, type=\"?gauges\"?><>Number"
  name: ""
  cache: true
# tableTenantInfo: emitted by SegmentStatusChecker as
#   pinot.controller.tableTenantInfo.<tableNameWithType>.<tenantType>.<tenantName>
# tenantType is one of: server, broker, tier.
# MUST appear before the generic tableNameWithType rules — the extra path segments would otherwise be consumed
# by those patterns and the tenantType/tenant labels would not be extracted.
- &pinot_rule_1
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.tableTenantInfo\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.([^.]+)\\.([^\"]+)\"><>(\\w+)"
  name: "pinot_controller_tableTenantInfo_$7"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    tableType: "$4"
    tenantType: "$5"
    tenant: "$6"
- <<: *pinot_rule_1
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.tableTenantInfo\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.([^.]+)\\.([^\"]+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept tableNameWithType
- &pinot_rule_2
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\\"?><>(\\w+)"
  name: "pinot_$1_$2_$7"
  cache: true
  labels:
    database: "$4"
    table: "$3$5"
    tableType: "$6"
- <<: *pinot_rule_2
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept tableNameWithType + partition
- &pinot_rule_3
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\d+)\"?><>(\\w+)"
  name: "pinot_$1_$2_$8"
  cache: true
  labels:
    database: "$4"
    table: "$3$5"
    tableType: "$6"
    partition: "$7"
- <<: *pinot_rule_3
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\d+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept the controller taskType
- &pinot_rule_4
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.(numMinionTasksInProgress|tasksTrackedForTaskType)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_controller_$1_$3"
  cache: true
  labels:
    taskType: "$2"
- <<: *pinot_rule_4
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(numMinionTasksInProgress|tasksTrackedForTaskType)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
  # Gauges that accept tableNameWithType + controller taskType
- &pinot_rule_5
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.(numMinionSubtasksRunning|numMinionSubtasksWaiting|numMinionSubtasksError|numMinionSubtasksUnknown|numMinionSubtasksDropped|numMinionSubtasksTimedOut|numMinionSubtasksAborted|percentMinionSubtasksInQueue|percentMinionSubtasksInError|maxSubtaskWaitTimeMs|maxSubtaskRunningTimeMs)\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_controller_$1_$7"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
    tableType: "$5"
    taskType: "$6"
- <<: *pinot_rule_5
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(numMinionSubtasksRunning|numMinionSubtasksWaiting|numMinionSubtasksError|numMinionSubtasksUnknown|numMinionSubtasksDropped|numMinionSubtasksTimedOut|numMinionSubtasksAborted|percentMinionSubtasksInQueue|percentMinionSubtasksInError|maxSubtaskWaitTimeMs|maxSubtaskRunningTimeMs)\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# We hardcode `cronScheduleJobScheduled` and `periodicTaskError`
# cronScheduleJobScheduled exports the label `table=${tableName}_${tableType}.
- &pinot_rule_6
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.cronSchedulerJobScheduled\\.(([^.]+)\\.)?([^.]*)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_controller_cronSchedulerJobScheduled_$5"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    taskType: "$4"
- <<: *pinot_rule_6
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.cronSchedulerJobScheduled\\.(([^.]+)\\.)?([^.]*)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
- &pinot_rule_7
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.periodicTaskError\"><>(\\w+)"
  name: "pinot_controller_periodicTaskError_$6"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    tableType: "$4"
    periodicTask: "$5"
- <<: *pinot_rule_7
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.periodicTaskError\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept tableNameWithType + the controller taskType
- &pinot_rule_8
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.([^.]*)\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_controller_$1_$7"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
    tableType: "$5"
    taskType: "$6"
- <<: *pinot_rule_8
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.([^.]*)\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
  # Special handling for timers like cronSchedulerJobExecutionTimeMs and tableRebalanceExecutionTimeMs which use table name, table type and another string for status / taskType
- &pinot_rule_9
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.cronSchedulerJobExecutionTimeMs\"><>(\\w+)"
  name: "pinot_controller_cronSchedulerJobExecutionTimeMs_$6"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    tableType: "$4"
    taskType: "$5"
- <<: *pinot_rule_9
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.cronSchedulerJobExecutionTimeMs\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
- &pinot_rule_10
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.tableRebalanceExecutionTimeMs\"><>(\\w+)"
  name: "pinot_controller_tableRebalanceExecutionTimeMs_$6"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    tableType: "$4"
    status: "$5"
- <<: *pinot_rule_10
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.tableRebalanceExecutionTimeMs\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept taskType and task status
- &pinot_rule_11
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.([^.]*)\\.([^.]*)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_controller_$1_$4"
  cache: true
  labels:
    taskType: "$2"
    status: "$3"
- <<: *pinot_rule_11
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.([^.]*)\\.([^.]*)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Meter for controller periodic tasks runs
- &pinot_rule_12
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"?pinot\\.controller\\.(\\w+)\\.controllerPeriodicTaskRun\"?><>(\\w+)"
  name: "pinot_controller_periodicTaskRun_$1_$2"
  cache: true
- <<: *pinot_rule_12
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.(\\w+)\\.controllerPeriodicTaskRun\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Meters/timers that accept tableNameWithType
- &pinot_rule_13
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$6_$7"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
    tableType: "$5"
- <<: *pinot_rule_13
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Meters/timers that accept rawTableName
- &pinot_rule_14
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$5_$6"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
- <<: *pinot_rule_14
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Global meters that have prefix `controller`
- &pinot_rule_15
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"ControllerMetrics\", name=\"pinot\\.controller\\.controller(\\w+)\"><>(\\w+)"
  name: "pinot_controller_$1_$2"
  cache: true
- <<: *pinot_rule_15
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.controller\\.controller(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Global gauges/meters/timers
- &pinot_rule_16
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$2_$3"
  cache: true
- <<: *pinot_rule_16
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"

