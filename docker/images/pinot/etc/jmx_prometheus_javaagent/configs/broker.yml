rules:
# Dropwizard exposes Number as an alias of Value for numeric gauges.
- pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=.*, type=\"?gauges\"?><>Number"
  name: ""
  cache: true
# Meters/timers that accept tableNameWithType
- &pinot_rule_1
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$6_$7"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
    tableType: "$5"
- <<: *pinot_rule_1
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept tableNameWithType
- &pinot_rule_2
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\\"?><>(\\w+)"
  name: "pinot_$1_$2_$7"
  cache: true
  labels:
    database: "$4"
    table: "$3$5"
    tableType: "$6"
- <<: *pinot_rule_2
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\\.((\\w+)\\.)?(\\w+)_(OFFLINE|REALTIME)\\\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Gauges that accept raw table name. Add any new metric names to (requestSize) group
# We've to hardcode metric names otherwise meters/timers start colliding with this regexp. This happens due to inconsistent naming convention of gauges. Ref: https://github.com/apache/pinot/pull/14348#pullrequestreview-2480114447
- &pinot_rule_3
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"BrokerMetrics\", name=\"pinot\\.broker\\.(requestSize)\\.(([^.]+)\\.)?([^.]*)\"><>(\\w+)"
  name: "pinot_broker_$1_$5"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
- <<: *pinot_rule_3
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.broker\\.(requestSize)\\.(([^.]+)\\.)?([^.\"]*)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Meters/timers that accept rawTableName
- &pinot_rule_4
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$5_$6"
  cache: true
  labels:
    database: "$3"
    table: "$2$4"
- <<: *pinot_rule_4
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.((\\w+)\\.)?(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# These five meters are exported as `pinot_broker_exceptions_`. This regex has been added to maintain backward compat. Don't add more metrics to this list. They should rather be exported as `pinot_broker_myException`
- &pinot_rule_5
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"BrokerMetrics\", name=\"pinot\\.broker\\.(uncaughtGet|uncaughtPost|queryRejected|requestCompilation|resourceMissing)Exceptions\"><>(\\w+)"
  name: "pinot_broker_exceptions_$1_$2"
  cache: true
- <<: *pinot_rule_5
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.broker\\.(uncaughtGet|uncaughtPost|queryRejected|requestCompilation|resourceMissing)Exceptions\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# All global gauge/meters/timers. Group-flexible at the prefix so non-broker MBean groups
# registered in this JVM (e.g. pinot.mse.* from the multi-stage engine emitter) are also exported.
- &pinot_rule_6
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$2_$3"
  cache: true
- <<: *pinot_rule_6
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
