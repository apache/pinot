rules:
# Dropwizard exposes Number as an alias of Value for numeric gauges.
- pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=.*, type=\"?gauges\"?><>Number"
  name: ""
  cache: true
# Meters/timers that accept tableNameWithType and minion taskType
- &pinot_rule_1
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"MinionMetrics\", name=\"pinot\\.minion\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_minion_$6_$7"
  cache: true
  labels:
    database: "$2"
    table: "$1$3"
    tableType: "$4"
    taskType: "$5"
- <<: *pinot_rule_1
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.minion\\.(([^.]+)\\.)?([^.]*)_(OFFLINE|REALTIME)\\.(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# Meters that accept either rawTableName or tableNameWithType ($1). $2 is the metric name
- &pinot_rule_2
  pattern: "\"org\\.apache\\.pinot\\.common\\.metrics\"<type=\"MinionMetrics\", name=\"pinot\\.minion\\.(\\w+)\\.(\\w+)\"><>(\\w+)"
  name: "pinot_minion_$2_$3"
  cache: true
  labels:
    id: "$1"
- <<: *pinot_rule_2
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.minion\\.(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
# All global gauges/meters/timers
- &pinot_rule_3
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<type=\"?\\w+\"?, name=\"?pinot\\.(\\w+)\\.(\\w+)\"?><>(\\w+)"
  name: "pinot_$1_$2_$3"
  cache: true
- <<: *pinot_rule_3
  pattern: "\"?org\\.apache\\.pinot\\.common\\.metrics\"?<name=\"?pinot\\.(\\w+)\\.(\\w+)\"?, type=\"?(?:gauges|meters|timers|counters|histograms)\"?><>(\\w+)"
