syntax = "proto3";

package org.apache.pinot.common.proto.legacy;

option java_package = "org.apache.pinot.common.proto.legacy";
option java_outer_classname = "LegacyExpressions";

// Frozen pre-VARIANT view of the expression wire enum. This intentionally omits
// VARIANT so tests exercise how an un-upgraded peer handles wire value 24.
enum ColumnDataType {
  INT = 0;
  LONG = 1;
  FLOAT = 2;
  DOUBLE = 3;
  BIG_DECIMAL = 4;
  BOOLEAN = 5;
  TIMESTAMP = 6;
  STRING = 7;
  JSON = 8;
  BYTES = 9;
  OBJECT = 10;
  INT_ARRAY = 11;
  LONG_ARRAY = 12;
  FLOAT_ARRAY = 13;
  DOUBLE_ARRAY = 14;
  BOOLEAN_ARRAY = 15;
  TIMESTAMP_ARRAY = 16;
  STRING_ARRAY = 17;
  BYTES_ARRAY = 18;
  UNKNOWN = 19;
  MAP = 20;
  BIG_DECIMAL_ARRAY = 21;
  UUID = 22;
  UUID_ARRAY = 23;
}

message FunctionCall {
  ColumnDataType data_type = 1;
}
